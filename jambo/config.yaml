name: Jambo Audiobooks
version: "1.8.7"
slug: jambo
description: Shared audiobook player for two — see each other's progress on the timeline
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:book-play
panel_title: Jambo
panel_admin: false
homeassistant_api: true
map:
  - share:rw
  - media:rw
options:
  books_dir: /share/jambo/books
  overtake_notifications: []
  listening_notifications: true
schema:
  books_dir: str
  overtake_notifications:
    - profile: str
      service: str
  listening_notifications: bool
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Optional direct access (for installing Jambo as a phone PWA with lock-screen playback). Leave disabled to keep it ingress-only.
